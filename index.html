<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financial Report: Coach Eka</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffafb; --line: #f4d6e2; --tint: #fde9f1;
    --accent: #cf3f7b; --ink: #3b1f2b; --muted: #8a6275;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Segoe UI", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 12px 96px;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.35;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 4px 2px 14px; }
  .logo { width: 58px; height: 58px; flex: none; }
  .brand { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  h1 { font-family: var(--serif); font-size: 25px; line-height: 1.1; margin: 2px 0 0; font-weight: 700; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .card h2 {
    font-family: var(--serif); font-size: 19px; font-weight: 700; margin: 0 0 8px;
    color: var(--accent); display: flex; justify-content: space-between; align-items: baseline;
  }
  .card h2 span { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; letter-spacing: .02em; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%; min-width: 0; height: 44px; padding: 8px 12px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
  }
  input::placeholder { color: #c9a9b8; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  button {
    font: inherit; font-weight: 500; cursor: pointer; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff;
  }
  button:active { opacity: .85; }
  .full { width: 100%; height: 46px; margin-top: 12px; font-size: 16px; }
  .add { flex: 0 0 48px; height: 44px; font-size: 24px; line-height: 1; padding: 0; }
  .ghost { background: var(--tint); color: var(--accent); }
  .linkbtn { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 6px; width: 100%; font-weight: 400; }
  .sum { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sum b { font-weight: 600; }
  .sum small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .sum button { flex: none; height: 34px; padding: 0 14px; font-size: 13px; }
  .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .hint b { color: var(--accent); font-weight: 600; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--tint); }
  .list li:last-child { border-bottom: 0; }
  .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp { white-space: nowrap; font-weight: 500; }
  .del { width: 30px; height: 30px; padding: 0; background: var(--tint); color: var(--accent); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 8px 0; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 0; border-bottom: 1px solid var(--tint); }
  tr:last-child td { border-bottom: 0; }
  td:last-child { text-align: right; font-weight: 500; white-space: nowrap; padding-left: 10px; }
  tr.sub td { color: var(--muted); padding-left: 12px; font-size: 13px; }
  tr.sub td:last-child { padding-left: 10px; font-weight: 400; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .bar-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .tot { flex: 1; line-height: 1.1; }
  .tot small { display: block; color: var(--muted); font-size: 12px; }
  .tot b { font-family: var(--serif); font-size: 24px; color: var(--accent); font-weight: 700; }
  #btnRekap { flex: none; height: 46px; padding: 0 24px; font-size: 16px; }
  .msg { display: none; margin-bottom: 12px; padding: 9px 12px; border-radius: 10px; background: var(--tint); font-size: 14px; }
  .msg.show { display: block; }
  .msg.err { background: #ffe6e6; color: #9b1c1c; }
  #preview { display: none; text-align: center; }
  #preview img { max-width: 100%; border: 1px solid var(--line); border-radius: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Logo Diva Tirta Renang">
    <div>
      <div class="brand">Diva Tirta Renang</div>
      <h1>Financial Report: Coach Eka</h1>
    </div>
  </header>

  <!-- Pertemuan belum dikunci -->
  <div class="card" id="setup">
    <h2>Pertemuan</h2>
    <div class="row">
      <div>
        <label for="tempat">Tempat</label>
        <select id="tempat">
          <option value="">Pilih tempat</option>
          <option>Sumberbeling</option><option>NK Cafe</option>
          <option>Manali Hill</option><option>Langlang Waterplay</option>
          <option>Kostrad</option>
        </select>
      </div>
      <div>
        <label for="tanggal">Tanggal</label>
        <input type="date" id="tanggal">
      </div>
    </div>
    <label for="coach1">Coach 1 (hasil 70%)</label>
    <input type="text" id="coach1" placeholder="Nama coach 1" autocomplete="off">
    <label for="coach2">Coach 2 (hasil 30%)</label>
    <input type="text" id="coach2" placeholder="Nama coach 2" autocomplete="off">
    <div class="hint" id="hintSetup"></div>
    <button type="button" class="full" id="btnKunci">Simpan dan kunci</button>
  </div>

  <!-- Pertemuan sudah dikunci -->
  <div class="card" id="locked" hidden>
    <div class="sum">
      <div>
        <b id="sTempat"></b> · <span id="sTanggal"></span>
        <small id="sCoach"></small>
      </div>
      <button type="button" class="ghost" id="btnUbah">Ubah</button>
    </div>
  </div>

  <div class="msg err" id="err"></div>

  <div class="card" id="addCard" hidden>
    <h2>Tambah peserta <span id="hint"></span></h2>
    <div class="row">
      <input type="text" id="nama" placeholder="Nama peserta" autocomplete="off">
      <button type="button" class="add" id="btnTambah" aria-label="Tambah peserta">+</button>
    </div>
  </div>

  <div class="card">
    <h2>Peserta <span id="jumlah"></span></h2>
    <ul class="list" id="daftar"></ul>
  </div>

  <div class="card">
    <h2>Pembagian hasil</h2>
    <table>
      <tr><td>Kas DTR (20%)</td><td id="rDTR"></td></tr>
      <tr><td>Sisa 80%</td><td id="rSisa80"></td></tr>
      <tr class="sub"><td>Kas Kolam (10% dari 80%)</td><td id="rKolam"></td></tr>
      <tr class="sub"><td>Untuk coach</td><td id="rBagi"></td></tr>
      <tr><td id="lEka">Coach 1 (70%)</td><td id="rEka"></td></tr>
      <tr><td id="lLain">Coach 2 (30%)</td><td id="rLain"></td></tr>
    </table>
  </div>

  <div class="msg" id="msgRekap"></div>

  <div class="card" id="preview">
    <h2>Hasil rekap</h2>
    <img id="imgRekap" alt="Gambar rekap keuangan">
    <button type="button" class="full" id="btnDownload">Download gambar</button>
  </div>

  <button type="button" class="linkbtn" id="btnReset">Kosongkan daftar peserta</button>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="tot"><small>Total pembayaran</small><b id="total">Rp 0</b></div>
    <button type="button" id="btnRekap">Rekap</button>
  </div>
</div>

<script>
  var HARGA = {
    'Sumberbeling': 25000,
    'NK Cafe': 15000,
    'Manali Hill': 20000,
    'Langlang Waterplay': 20000,
    'Kostrad': 20000
  };
  var KEY = 'dtr_state_v2';
  // S.sesi = pertemuan yang sudah dikunci (tempat, tanggal, coach1, coach2)
  var S = { sesi: null, editing: false, peserta: [] };
  var lastDataUrl = '';
  var $ = function (id) { return document.getElementById(id); };

  function rp(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
  function harga() { return S.sesi ? (HARGA[S.sesi.tempat] || 0) : 0; }
  function simpan() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function showMsg(el, text, isErr) { el.textContent = text; el.className = 'msg show' + (isErr ? ' err' : ''); }
  function clearErr() { $('err').className = 'msg err'; }

  function formatTanggal(iso) {
    var b = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var p = iso.split('-');
    return Number(p[2]) + ' ' + b[Number(p[1]) - 1] + ' ' + p[0];
  }

  function hitung() {
    var total = S.peserta.length * harga();
    var sisa80 = total * 0.80, kasKolam = sisa80 * 0.10, bagi = sisa80 - kasKolam;
    return { total: total, kasDTR: total * 0.20, sisa80: sisa80, kasKolam: kasKolam,
             bagi: bagi, eka: bagi * 0.70, lainnya: bagi * 0.30 };
  }

  function render() {
    var showSetup = !S.sesi || S.editing;
    $('setup').hidden = !showSetup;
    $('locked').hidden = showSetup;
    $('addCard').hidden = showSetup;

    if (S.sesi) {
      $('sTempat').textContent = S.sesi.tempat;
      $('sTanggal').textContent = formatTanggal(S.sesi.tanggal);
      $('sCoach').textContent = 'Coach 1: ' + S.sesi.coach1 + ' (70%) · Coach 2: ' + S.sesi.coach2 + ' (30%)';
      $('hint').textContent = rp(harga()) + ' / peserta';
      $('lEka').textContent = S.sesi.coach1 + ' (70%)';
      $('lLain').textContent = S.sesi.coach2 + ' (30%)';
    } else {
      $('lEka').textContent = 'Coach 1 (70%)';
      $('lLain').textContent = 'Coach 2 (30%)';
    }

    var ul = $('daftar'); ul.innerHTML = '';
    if (!S.peserta.length) {
      var e = document.createElement('li'); e.className = 'empty';
      e.textContent = 'Belum ada peserta.'; ul.appendChild(e);
    }
    S.peserta.forEach(function (p, i) {
      var li = document.createElement('li');
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (i + 1) + '. ' + p.nama;
      var r = document.createElement('span'); r.className = 'rp'; r.textContent = rp(harga());
      var d = document.createElement('button'); d.type = 'button'; d.className = 'del'; d.textContent = '✕';
      d.setAttribute('aria-label', 'Hapus ' + p.nama);
      d.onclick = function () { S.peserta.splice(i, 1); render(); };
      li.appendChild(nm); li.appendChild(r); li.appendChild(d); ul.appendChild(li);
    });
    $('jumlah').textContent = S.peserta.length ? S.peserta.length + ' orang' : '';

    var h = hitung();
    $('total').textContent = rp(h.total);
    $('rDTR').textContent = rp(h.kasDTR); $('rSisa80').textContent = rp(h.sisa80);
    $('rKolam').textContent = rp(h.kasKolam); $('rBagi').textContent = rp(h.bagi);
    $('rEka').textContent = rp(h.eka); $('rLain').textContent = rp(h.lainnya);
    simpan();
  }

  // Tampilkan harga saat tempat dipilih
  $('tempat').addEventListener('change', function () {
    var h = HARGA[this.value];
    $('hintSetup').textContent = h ? 'Harga per peserta: ' + rp(h) : '';
  });

  $('btnKunci').onclick = function () {
    var tempat = $('tempat').value, tanggal = $('tanggal').value;
    var c1 = $('coach1').value.trim(), c2 = $('coach2').value.trim();
    var err = $('err');
    if (!tempat) { showMsg(err, 'Pilih tempat dulu.', true); $('tempat').focus(); return; }
    if (!tanggal) { showMsg(err, 'Isi tanggal dulu.', true); $('tanggal').focus(); return; }
    if (!c1) { showMsg(err, 'Nama coach 1 belum diisi.', true); $('coach1').focus(); return; }
    if (!c2) { showMsg(err, 'Nama coach 2 belum diisi.', true); $('coach2').focus(); return; }
    clearErr();

    var prev = S.sesi;
    var berubah = prev && (prev.tempat !== tempat || prev.tanggal !== tanggal);
    if (berubah && S.peserta.length && confirm('Tempat atau tanggal berubah. Kosongkan daftar peserta sebelumnya?')) {
      S.peserta = [];
      $('preview').style.display = 'none';
    }
    S.sesi = { tempat: tempat, tanggal: tanggal, coach1: c1, coach2: c2 };
    S.editing = false;
    render();
    $('nama').focus();
  };

  $('btnUbah').onclick = function () {
    $('tempat').value = S.sesi.tempat;
    $('tanggal').value = S.sesi.tanggal;
    $('coach1').value = S.sesi.coach1;
    $('coach2').value = S.sesi.coach2;
    $('tempat').dispatchEvent(new Event('change'));
    S.editing = true;
    render();
  };

  function tambah() {
    var nama = $('nama').value.trim();
    var err = $('err');
    if (!S.sesi || S.editing) { showMsg(err, 'Simpan dan kunci data pertemuan dulu.', true); return; }
    if (!nama) { showMsg(err, 'Nama peserta belum diisi.', true); $('nama').focus(); return; }
    clearErr();
    S.peserta.push({ nama: nama });
    $('nama').value = '';
    render(); $('nama').focus();
  }
  $('btnTambah').onclick = tambah;
  $('nama').addEventListener('keydown', function (e) { if (e.key === 'Enter') tambah(); });

  $('btnReset').onclick = function () {
    if (!confirm('Kosongkan daftar peserta?')) return;
    S.peserta = []; render();
    $('preview').style.display = 'none'; $('msgRekap').className = 'msg';
  };

  /* ---------- Gambar rekap ---------- */
  var logoImg = new Image();
  var logoReady = new Promise(function (res) { logoImg.onload = res; logoImg.onerror = res; });
  logoImg.src = 'logo.png';

  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all([
      document.fonts.load('700 38px "Cormorant Garamond"'),
      document.fonts.load('400 22px "Jost"'),
      document.fonts.load('500 22px "Jost"')
    ]).catch(function () {});
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function muat(ctx, text, maxW) {
    while (ctx.measureText(text).width > maxW && text.length > 4) text = text.slice(0, -2);
    return text;
  }

  function gambar() {
    var s = S.sesi, h = hitung(), n = S.peserta.length;
    var W = 900, pad = 56, rowH = 50, scale = 2;
    var tinggi = 1010 + n * rowH;
    var c = document.createElement('canvas');
    c.width = W * scale; c.height = tinggi * scale;
    var ctx = c.getContext('2d'); ctx.scale(scale, scale);
    var serif = '"Cormorant Garamond", Georgia, serif';
    var sans = '"Jost", "Segoe UI", sans-serif';
    var INK = '#3b1f2b', MUTED = '#8a6275', ACC = '#cf3f7b', LINE = '#f4d6e2', TINT = '#fde9f1';

    ctx.fillStyle = '#fffafb'; ctx.fillRect(0, 0, W, tinggi);

    // Header
    if (logoImg.naturalWidth) ctx.drawImage(logoImg, pad, 40, 130, 130);
    ctx.fillStyle = ACC; ctx.font = '500 20px ' + sans; ctx.textAlign = 'left';
    ctx.fillText('DIVA TIRTA RENANG', pad + 160, 84);
    ctx.fillStyle = INK; ctx.font = '700 38px ' + serif;
    ctx.fillText('Financial Report: Coach Eka', pad + 160, 134);
    ctx.strokeStyle = LINE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pad, 196); ctx.lineTo(W - pad, 196); ctx.stroke();

    // Info pertemuan
    var info = [['Tempat', s.tempat], ['Tanggal', formatTanggal(s.tanggal)],
                ['Coach 1 (70%)', s.coach1], ['Coach 2 (30%)', s.coach2]];
    info.forEach(function (r, i) {
      var y = 236 + i * 38;
      ctx.fillStyle = MUTED; ctx.font = '400 22px ' + sans; ctx.fillText(r[0], pad, y);
      ctx.fillStyle = INK; ctx.font = '500 24px ' + sans;
      ctx.fillText(muat(ctx, r[1], W - pad * 2 - 200), pad + 200, y);
    });
    ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(pad, 380); ctx.lineTo(W - pad, 380); ctx.stroke();

    // Daftar peserta
    ctx.fillStyle = ACC; ctx.font = '700 32px ' + serif;
    ctx.fillText('Daftar peserta (' + n + ' orang)', pad, 432);
    var top = 446;
    S.peserta.forEach(function (p, i) {
      var cy = top + i * rowH + 33;
      ctx.textAlign = 'left'; ctx.fillStyle = INK; ctx.font = '400 24px ' + sans;
      ctx.fillText(muat(ctx, (i + 1) + '. ' + p.nama, 520), pad, cy);
      ctx.textAlign = 'right'; ctx.font = '500 24px ' + sans;
      ctx.fillText(rp(harga()), W - pad, cy);
      if (i < n - 1) {
        ctx.strokeStyle = TINT; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(pad, top + (i + 1) * rowH); ctx.lineTo(W - pad, top + (i + 1) * rowH); ctx.stroke();
      }
    });
    ctx.textAlign = 'left';

    // Total
    var boxTop = top + n * rowH + 30;
    roundRect(ctx, pad - 16, boxTop, W - 2 * (pad - 16), 68, 14);
    ctx.fillStyle = TINT; ctx.fill();
    ctx.fillStyle = INK; ctx.font = '600 26px ' + sans;
    ctx.fillText('Total pembayaran', pad, boxTop + 44);
    ctx.textAlign = 'right'; ctx.fillStyle = ACC; ctx.font = '700 34px ' + serif;
    ctx.fillText(rp(h.total), W - pad, boxTop + 45);
    ctx.textAlign = 'left';

    // Pembagian hasil
    var head2 = boxTop + 68 + 64;
    ctx.fillStyle = ACC; ctx.font = '700 32px ' + serif;
    ctx.fillText('Pembagian hasil', pad, head2);
    var top2 = head2 + 16;
    var baris = [
      ['Kas DTR (20% dari total)', h.kasDTR, 0],
      ['Sisa 80% dari total', h.sisa80, 0],
      ['Kas Kolam (10% dari 80%)', h.kasKolam, 1],
      ['Sisa untuk coach (90% dari 80%)', h.bagi, 1],
      [s.coach1 + ' (70%)', h.eka, 0],
      [s.coach2 + ' (30%)', h.lainnya, 0]
    ];
    baris.forEach(function (b, i) {
      var cy = top2 + i * rowH + 33, sub = b[2];
      ctx.textAlign = 'left';
      ctx.fillStyle = sub ? MUTED : INK;
      ctx.font = (sub ? '400 22px ' : '400 24px ') + sans;
      ctx.fillText(muat(ctx, b[0], 520), pad + (sub ? 24 : 0), cy);
      ctx.textAlign = 'right'; ctx.font = (sub ? '400 22px ' : '500 24px ') + sans;
      ctx.fillText(rp(b[1]), W - pad, cy);
      if (i < baris.length - 1) {
        ctx.strokeStyle = TINT; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(pad, top2 + (i + 1) * rowH); ctx.lineTo(W - pad, top2 + (i + 1) * rowH); ctx.stroke();
      }
    });
    ctx.textAlign = 'left';
    ctx.fillStyle = MUTED; ctx.font = '400 18px ' + sans;
    ctx.fillText('Dibuat ' + new Date().toLocaleString('id-ID'), pad, tinggi - 30);
    return c.toDataURL('image/png');
  }

  $('btnRekap').onclick = function () {
    var err = $('err'), msg = $('msgRekap');
    if (!S.sesi || S.editing) { showMsg(err, 'Simpan dan kunci data pertemuan dulu.', true); window.scrollTo(0, 0); return; }
    if (!S.peserta.length) { showMsg(err, 'Belum ada peserta yang diinput.', true); return; }
    clearErr();
    var btn = $('btnRekap'); btn.disabled = true; btn.textContent = '...';
    Promise.all([fontsReady(), logoReady]).then(function () {
      lastDataUrl = gambar();
      $('imgRekap').src = lastDataUrl;
      $('preview').style.display = 'block';
      $('preview').scrollIntoView({ behavior: 'smooth' });
      showMsg(msg, 'Rekap selesai. Tekan Download gambar untuk menyimpan.', false);
    }).catch(function () {
      showMsg(err, 'Gagal membuat gambar. Coba lagi.', true);
    }).then(function () { btn.disabled = false; btn.textContent = 'Rekap'; });
  };

  $('btnDownload').onclick = function () {
    if (!lastDataUrl || !S.sesi) return;
    var a = document.createElement('a');
    a.href = lastDataUrl;
    a.download = 'rekap-renang-' + S.sesi.tempat.replace(/\s+/g, '-') + '-' + S.sesi.tanggal + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  /* ---------- Mulai ---------- */
  (function () {
    var d = new Date();
    $('tanggal').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    try {
      var st = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (st && Array.isArray(st.peserta)) {
        S.peserta = st.peserta;
        S.sesi = st.sesi || null;
